# Edge Function para Sitemap dinâmico (DEVE vir ANTES do prerender)
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# Edge Function para SEO (prerender para bots)
[[edge_functions]]
  path = "/*"
  function = "prerender"

# SPA redirect (deve vir DEPOIS da edge function)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para SEO e cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"
